<style>
:root{--ind:#5B5BD6;--river:#0A5C7A;--ink:#0C2B38;--muted:#4F6B77;--bg:#EAF1F3;--surface:#fff;--line:#C9D9DF;--ok:#1B7F6B;--warn:#8A5A00;--bad:#C0392B;--chip:#E3EEF2;--act:#DDEEFB;--on:#fff}

*,*::before,*::after{box-sizing:border-box}html,body{margin:0}

.ib{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer}.burger{display:inline-block;font-size:1.05rem;line-height:1;min-width:40px;min-height:40px}.ov{display:none}nav a:focus-visible,.ib:focus-visible,.acct a:focus-visible{outline:2px solid var(--river);outline-offset:2px}nav a{white-space:nowrap}

.desc{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}

thead th{color:var(--muted);font-size:.78rem;font-weight:600}tr.cl{cursor:pointer}tr.cl:hover{background:var(--chip)}

.s-Approved{color:var(--ok)}.s-Submitted,.s-Reviewed{color:var(--warn)}.s-Rejected{color:var(--bad)}.up{color:var(--warn)}.dn{color:var(--ok)}.dim{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:7px 14px;background:var(--river);color:var(--on);font-weight:600;cursor:pointer}.btn.bad{background:var(--bad);color:#fff}.btn.ghost{background:var(--chip);color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}

@media(min-width:861px){.app.mini aside{width:68px}.app.mini .brand{padding-left:13px;padding-right:13px;justify-content:center}.app.mini .brand>div:nth-child(2),.app.mini .pill,.app.mini .sec,.app.mini nav a .n,.app.mini .acct{display:none}.app.mini nav a{justify-content:center;margin:2px 10px;padding:10px 0;position:relative}.app.mini nav a i{width:auto;font-size:1.15rem}.app.mini nav a .bd{position:absolute;top:2px;right:4px;min-width:8px;height:8px;padding:0;font-size:0}.app.mini nav a[title]:hover::after{content:attr(title);position:fixed;left:76px;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:8px;font-size:.8rem;z-index:40;pointer-events:none}}
@media(prefers-reduced-motion:reduce){aside,.ov,.sw s,.sw s::after,#toast{transition:none!important}}

.k4{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.k4 .kpi{margin:0}

/* ===== UI 2.0 skin (CSS only: markup, JS, API and permissions are untouched) ===== */
:root{--navy:#123047;--teal:#087E8B;--river:#087E8B;--ink:#183247;--muted:#647789;--bg:#F4F7FA;--surface:#fff;--line:#DCE5EC;--ok:#16866A;--warn:#8A5A00;--bad:#C53A3A;--chip:#EDF2F6;--act:#E1F1F3;--on:#fff;--sh:0 1px 2px rgba(18,48,71,.05),0 2px 8px rgba(18,48,71,.04);--r:12px}
:root[data-theme="dark"]{--navy:#0A2230;--teal:#4FC3CF;--river:#4FC3CF;--bg:#0A1A22;--surface:#10303D;--ink:#E6F1F5;--muted:#9DB8C4;--line:#1D4556;--ok:#7FD8C0;--warn:#F4C95A;--bad:#FF8A7A;--chip:#143846;--act:#17465A;--on:#06202B;--sh:none}
body{font-family:Inter,"Kantumruy Pro","Kantumruy Pro","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.brand{background:transparent;border-bottom:1px solid rgba(255,255,255,.1)}.brand b{color:#fff}.brand small{color:#9DB8C4}
.logo{background:var(--teal);color:#fff}.pill{background:rgba(255,255,255,.14);color:#fff}
.sec{color:#8FB0C2;letter-spacing:0}
nav a{color:#D6E4EC;border-radius:10px;position:relative}nav a small{color:#9DB8C4}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:rgba(8,126,139,.38);color:#fff}nav a.on small{color:#CFE6EC}
nav a.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#4FC3CF}
.acct{border-top:1px solid rgba(255,255,255,.1);color:#9DB8C4}.acct b{color:#fff}.acct a{color:#7ED6DF}
.top{box-shadow:var(--sh)}.top h1{font-weight:700;color:var(--ink)}
.ib{border-radius:8px;min-height:36px}.ib:hover{background:var(--chip)}
section{max-width:1180px}
.card{border-radius:var(--r);box-shadow:var(--sh)}.card h2{font-weight:600;font-size:.98rem}
.kpi{border-left-width:3px}.kpi .v{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi:hover{box-shadow:0 6px 16px rgba(18,48,71,.1)}
table{font-variant-numeric:tabular-nums}
th,td{padding:9px 12px}
thead th{background:var(--chip);color:var(--muted);font-weight:600}
.sc thead th{background:var(--chip)}

.btn{border-radius:8px;min-height:36px;padding:7px 16px;transition:filter .15s}.btn:hover:not(:disabled){filter:brightness(1.08)}

/* Phase 6 fix: long Khmer menu labels wrap instead of being clipped */
nav a b,nav a small{white-space:normal;overflow-wrap:anywhere}nav a .n{line-height:1.6}.sec{white-space:normal}
/* Dashboard 2.0 (section 1): KPI icons, alert, chart row */
.kpi .kh{display:flex;align-items:center;justify-content:space-between;gap:8px}.kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac,var(--river)) 14%,transparent);color:var(--ac,var(--river));font-size:.95rem;flex:none}

/* Section 2: Current Setpoint */
.cp-tt{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.cp-tt h2{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp-live{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.cp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cp-tools input{min-width:170px}
.cp-seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}.cp-seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font:inherit;font-size:.82rem;color:var(--muted);cursor:pointer;min-height:30px}.cp-seg button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn.dark{background:#1f2d3d;color:#fff}.cp-card{padding:0;overflow:hidden}.cp-cap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px;font-size:.8rem}
.cpt{width:100%;border-collapse:collapse}.cpt th{background:var(--chip);font-size:.78rem;padding:12px 10px;white-space:nowrap}.cpt td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}.cpt .c{text-align:center}
.cp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}.cp-m{display:block;font-size:1rem}.cp-s{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}.cp-blue{color:var(--river)}
.cpt .cp-av{background:color-mix(in srgb,var(--river) 7%,transparent)}.cp-u{color:var(--warn);font-weight:600}.cp-d{color:var(--river);font-weight:600}.cp-n{color:var(--muted)}
.cp-ft{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
/* animated sparkline */
.cp-ln{stroke-dasharray:1;stroke-dashoffset:1;animation:cpdraw 1.1s ease-out forwards}
.cp-ar{opacity:0;animation:cpfade .8s ease-out forwards;--o:.14}
.cp-pl{opacity:0;animation:cpfade .3s ease-out forwards;--o:1}
.cp-pu{opacity:0;transform-box:fill-box;transform-origin:center;animation:cppulse 1.8s ease-out infinite}
@keyframes cpdraw{to{stroke-dashoffset:0}}@keyframes cpfade{to{opacity:var(--o)}}
@keyframes cppulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media(prefers-reduced-motion:reduce){.cp-ln{animation:none;stroke-dashoffset:0}.cp-ar{animation:none;opacity:.14}.cp-pl{animation:none;opacity:1}.cp-pu{animation:none;display:none}}
