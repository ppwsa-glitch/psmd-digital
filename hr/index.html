<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRD-HR Management V8.0</title><link rel="stylesheet" href="css/glass.css"><link rel="stylesheet" href="css/responsive.css">
<style>.tools select,.tools input,.fm select,.fm input{max-width:100%;min-width:0}.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hd h2{margin:0;font-size:1.05rem}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{border:0;border-radius:10px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer;background:var(--gl);color:var(--tx)}.tabs .on{background:var(--ac);color:#fff}
dl.f{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 12px;margin:0}dl.f dt{color:var(--mu);font-size:.8rem}dl.f dd{margin:0;overflow-wrap:anywhere}
.fm{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.fm label{font-size:.78rem;color:var(--mu);display:grid;gap:2px}.fm input,.fm select{padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:inherit}
.btn.alt{background:var(--ac)}.btn.er{background:var(--er)}.pg{display:flex;gap:8px;align-items:center;margin-top:10px}.msg{margin:8px 0}tr[data-id]{cursor:pointer}.arch{opacity:.55}#pa{display:none}@media print{body *{visibility:hidden !important}#pa,#pa *{visibility:visible !important}#pa{display:block !important;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font-size:11px}#pa table{border-collapse:collapse;width:100%}#pa th,#pa td{border:1px solid #888;padding:3px 5px;text-align:left}#pa h2{margin:0 0 4px}.side,.top,dialog{display:none !important}}</style></head>
<body><div class="app"><aside class="glass side" id="side"><button class="side-x" id="sx" type="button" aria-label="បិទម៉ឺនុយ">✕</button><div class="brand"><div class="logo">💧</div><div><b>PRD-HR</b><small>PSMD-Digital · V8.0</small></div></div>
<nav class="nav" id="nav"></nav><div class="demo" id="modeNote">ទិន្នន័យ Demo/សិប្បនិម្មិត · Security ជា Demo ក្នុង Browser ប៉ុណ្ណោះ</div></aside>
<main><div class="top"><button class="hamb" id="hb" type="button" aria-label="បើកម៉ឺនុយ" aria-controls="side" aria-expanded="false">☰</button><div><h1 id="ttl"></h1><div class="sub" id="crumb"></div></div><div class="glass user">👤 <span id="actas" class="k"></span> <select id="role"></select></div></div><section id="v"></section></main></div>
<div class="scrim" id="scrim"></div><div id="pa"></div><dialog id="dg"><div id="dc"></div><button class="x" onclick="dg.close()">បិទ</button></dialog>
<script src="js/core/core.js"></script><script src="js/core/xlsx.js"></script><script src="js/data/schema.js"></script><script src="js/data/providers.js"></script><script src="js/config.js"></script><script src="js/data/remote-provider.js"></script><script src="js/services/core-services.js"></script><script src="js/services/import-service.js"></script><script src="js/services/seed-service.js"></script><script src="js/services/hr-workflows.js"></script><script src="js/services/analytics-service.js"></script><script src="js/services/training-service.js"></script><script src="js/services/document-service.js"></script><script src="js/services/report-service.js"></script><script src="js/services/admin-service.js"></script><script src="js/legacy-adapter.js"></script>
<script src="js/ui/app.js"></script><script src="js/ui/org-attendance.js"></script><script src="js/ui/leave-career.js"></script><script src="js/ui/retire-perf.js"></script><script src="js/ui/awards-notif.js"></script><script src="js/ui/training.js"></script><script src="js/ui/documents.js"></script><script src="js/ui/dashboard.js"></script><script src="js/ui/reports.js"></script><script src="js/ui/admin.js"></script><script>var mn=document.getElementById("modeNote");if(mn&&PRDHR.remoteConfigured&&PRDHR.remoteConfigured()){mn.textContent="🔐 ភ្ជាប់ម៉ាស៊ីនបម្រើ (Google Sheet) · ផ្ទៀងផ្ទាត់ដោយ Hub · សិទ្ធិបង្ខំនៅ Server"}</script>
<script>(function(){var b=document.body,hb=document.getElementById("hb");function set(o){b.classList.toggle("nav-open",o);hb.setAttribute("aria-expanded",o?"true":"false")}
hb.onclick=function(){set(!b.classList.contains("nav-open"))};document.getElementById("sx").onclick=function(){set(false)};document.getElementById("scrim").onclick=function(){set(false)};
window.addEventListener("hashchange",function(){set(false)});document.addEventListener("keydown",function(e){if(e.key==="Escape")set(false)});
window.matchMedia("(min-width:761px)").addEventListener("change",function(m){if(m.matches)set(false)});window.scrollTo(0,0)})();</script>
