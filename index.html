<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSMD-Digital</title>
<meta name="application-name" content="PSMD-Digital">
<meta name="apple-mobile-web-app-title" content="PSMD-Digital">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EAF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1A22" media="(prefers-color-scheme: dark)">
<script>try{var m=localStorage.getItem("psmd_theme")||"auto";document.documentElement.dataset.theme=(m==="auto"?matchMedia("(prefers-color-scheme: dark)").matches:m==="dark")?"dark":"light"}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#06374A; --river:#0A5C7A; --ink:#0C2B38; --muted:#4F6B77;
  --bg:#EAF1F3; --surface:#FFFFFF; --line:#C9D9DF; --signal:#F4B400;
  --t1:#0A5C7A; --t2:#1B7F6B; --t3:#8A5A00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --bg:#0A1A22; --surface:#10303D; --ink:#E6F1F5; --muted:#9DB8C4; --line:#1D4556; --t1:#7CCBE6; --t2:#7FD8C0; --t3:#F4C95A; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{font-size:clamp(16px,14px + .35vw,19px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Kantumruy Pro","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.7; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
}
header.brand{
  display:flex; justify-content:center; flex:none;
  padding:clamp(18px,3vw,36px) 16px clamp(6px,1.5vw,16px);
}
.brand img{display:block; height:clamp(52px,8.5vw,96px); width:auto; max-width:100%}
/* Dark mode: swap to the light-text logo (transparent background) instead of putting the navy logo on a white box */
.brand .logo-dark{display:none}
:root[data-theme="dark"] .brand .logo-light{display:none}
:root[data-theme="dark"] .brand .logo-dark{display:block}
main{width:100%; max-width:640px; margin:0 auto; padding:6px 16px 32px; flex:1}
.lead{margin:0 4px 14px; color:var(--muted); font-size:.95rem}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px; grid-template-columns:1fr}
a.app{
  display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px;
  min-height:84px; transition:border-color .15s, box-shadow .15s;
}
a.app:active{transform:scale(.99)}
a.app:focus-visible{outline:3px solid var(--signal); outline-offset:2px}
a.app[aria-disabled="true"]{opacity:.55; pointer-events:none}
.ico{flex:none; width:60px; height:60px; border-radius:50%; display:block; filter:drop-shadow(0 2px 4px rgba(6,55,74,.28))}
.txt{flex:1; min-width:0}
.name{margin:0; font-weight:700; font-size:1.05rem}
.desc{margin:2px 0 0; font-size:.85rem; color:var(--muted)}
.go{flex:none; font-weight:600; font-size:.9rem; color:var(--river)}
:root[data-theme="dark"] .go{color:var(--t1)}
.install{
  display:none; width:100%; max-width:380px; margin:18px auto 0; padding:14px; border:0; border-radius:14px;
  background:var(--river); color:#fff; font:inherit; font-weight:700; font-size:1rem; cursor:pointer;
}
.install:focus-visible{outline:3px solid var(--signal); outline-offset:2px}
.hint{display:none; margin:16px 4px 0; font-size:.85rem; color:var(--muted)}
footer{width:100%; max-width:640px; margin:0 auto; padding:0 20px 28px; flex:none; font-size:.78rem; color:var(--muted)}
@media (hover:hover){
  a.app:hover{border-color:var(--river); box-shadow:0 4px 16px rgba(6,55,74,.14)}
}
/* Tablet / Computer: បង្ហាញជាកាតបញ្ឈរ ច្រើនជួរ ស្វ័យប្រវត្តិ */
@media (min-width:760px){
  main{max-width:1100px; padding:10px 24px 48px}
  footer{max-width:1100px; padding:0 28px 32px}
  .lead{margin:0 0 18px; font-size:1.05rem}
  ul{grid-template-columns:repeat(2,1fr); gap:18px}
  a.app{flex-direction:column; align-items:flex-start; gap:18px; padding:22px; min-height:200px}
  .ico{width:84px; height:84px}
  .txt{flex:1 1 auto; width:100%}
  .name{font-size:1.15rem}
  .desc{font-size:.92rem}
  .go{align-self:flex-end}
  .install{margin-left:0}
}
/* Computer: ៤ កម្មវិធីរៀបជាជួរតែមួយ */
@media (min-width:1000px){ul{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){a.app:active{transform:none} a.app{transition:none}}

#hub{display:flex; flex-direction:column; flex:1}
[hidden]{display:none !important}
.userbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 4px 12px; font-size:.9rem; color:var(--muted)}
.userbar button{font:inherit; font-weight:600; color:var(--river); background:none; border:1.5px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer}
:root[data-theme="dark"] .userbar button{color:var(--t1)}
.userbar button:focus-visible{outline:3px solid var(--signal); outline-offset:2px}

/* =========================================================================
     Browser login screen — v4, ported directly from ppwsa-login__Now.html
     (the design master). Structure/measurements/colors match that file
     field-for-field: logo + theme pill sit overlaid ON the hero (not a
     separate header bar), the theme switch is the exact sliding pill+thumb
     design, and field icons are the file's own inline SVGs, not emoji.
     Namespaced under .login-* so nothing collides with the authenticated
     app's .card/.field/.button/.header classes used elsewhere.
     ========================================================================= */
  .login-page-bg{
    position:fixed; inset:0; z-index:500; overflow-y:auto; overflow-x:hidden;
    background:#e9edf5; transition:background-color .35s ease;
    -webkit-overflow-scrolling:touch; /* momentum scrolling on iOS Safari/WebView */
  }
  .login-page-bg.dark{ background:#0a0f1c; }
  .login-screen{
    /* Plain block centering (margin:auto) instead of flex — a flex parent's
       default align-items:stretch was silently capping this element's
       height to the viewport's height (its min-height:100dvh became a hard
       ceiling, not a floor), clipping any content taller than one screen
       and leaving .login-page-bg with nothing left to actually scroll.
       margin:auto has no such cross-axis stretching behavior: the element
       is simply free to grow as tall as its content needs.
       min-height:100dvh forces this to always reach the real screen
       height — the hero photo below is flex:1 (not a fixed height), so it's
       the one that stretches to soak up any leftover space and reach the
       bottom edge, instead of leaving a blank gap under the card. */
    /* min-height uses svh, not dvh, on purpose: dvh keeps recalculating as
       Telegram's/iOS's own chrome shows or hides, and WebKit has a known bug
       where the flex CONTAINER picks up that new (often larger) height but
       the flex-grow CHILD (.login-hero below) doesn't get re-laid-out to
       match — the container grows, the hero doesn't, and the extra space
       shows up as a gap instead of taller hero photo, throwing off the
       hero:card ratio. svh is the "small viewport height" — it's set once
       to the viewport's smallest possible size and never changes after
       that, so there's nothing for the hero to fall out of sync with. vh is
       kept first purely as a fallback for the rare browser without svh
       support; svh wins wherever it's available (effectively every current
       iPhone build). */
    width:100%; max-width:430px; margin:0 auto; min-height:100vh; min-height:100svh;
    min-height:var(--tg-vp-stable-height, 100svh);
    /* var(--lp-card-bg), not a literal #fff: this box's own height (from
       min-height:100svh above) can end up taller than hero+card actually
       need — e.g. on a very tall fullscreen viewport — and that leftover
       sliver shows this background directly, not the card's. A literal
       #fff ignored .login-screen.dark entirely, so that sliver stayed
       white even in dark mode (visible as a bright band between the dark
       card and the dark page behind it). Tying it to the same variable the
       card uses means it always matches, light or dark, however much
       leftover space there is. */
    background:var(--lp-card-bg);
    position:relative; box-shadow:0 0 60px rgba(0,0,0,.10);
    display:flex; flex-direction:column;
    font-family:"Inter","Noto Sans Khmer","Kantumruy Pro","Khmer OS System",-apple-system,sans-serif;
    --lp-blue:#1479f7; --lp-blue-dark:#0e5fd6; --lp-ink:#0b1e42; --lp-muted:#8a93a6;
    --lp-line:#e3e8f2; --lp-card-bg:#fff; --lp-field-bg:#fff; --lp-field-ic:#7c8aa3;
    --lp-remember:#4c5568; --lp-social-border:#eef1f6;
    transition:background-color .35s ease, box-shadow .35s ease;
  }
  .login-screen.dark{
    --lp-blue:#3f8cff; --lp-blue-dark:#2569d6; --lp-ink:#eef2fb; --lp-muted:#93a0bd;
    --lp-line:#26314a; --lp-card-bg:#121a2c; --lp-field-bg:#182238; --lp-field-ic:#93a0bd;
    --lp-remember:#c4cce2; --lp-social-border:#26314a;
    box-shadow:0 0 60px rgba(0,0,0,.45);
  }

  /* ---------- Hero (logo + theme/lang pills overlaid on top of it) ---------- */
  .login-hero{
    /* flex:1 (not a fixed height) so this grows to absorb whatever room is
       left over between the card's natural height and the real screen
       height — that leftover space used to show up as a blank gap (first
       under the card, then split top/bottom once centered); now the hero
       photo itself just gets taller and fills it. min-height keeps it from
       being crushed below its intended size on very short screens, where
       .login-page-bg scrolls the overflow instead. */
    /* No max-height here (there used to be one, capped at 52svh): it was
       meant as a defensive ceiling, but on an actually-tall fullscreen
       viewport the correct hero:card split needs MORE than 52% — the card
       is a fixed height and the hero is the only flexible one, so taller
       screens legitimately need a taller hero to reach the bottom edge.
       Capping it just left the extra space unfilled (the white/dark-
       mismatch gap reported after the fullscreen fix). Trust flex:1 with
       the svh-based min-height on .login-screen above to keep this
       correctly sized instead. */
    position:relative; flex:1 1 380px; min-height:380px; overflow:hidden;
  }
  .login-hero-sky{
    position:absolute; top:0; left:0; right:0; height:76px;
    background:linear-gradient(180deg, #d9edfb 0%, #a9d8f6 55%, #86c5f0 100%);
  }
  .login-hero-photo{ position:absolute; left:0; right:0; bottom:0; top:76px; overflow:hidden; }
  .login-hero-photo .slide{
    position:absolute; inset:0; background-size:cover; background-position:center 20%;
    filter:saturate(1.32) brightness(1.1) contrast(1.12); opacity:0; transition:opacity 1.4s ease;
  }
  .login-hero-photo .slide.is-active{ opacity:1; }
  .login-hero-tint{
    position:absolute; inset:0; mix-blend-mode:color;
    background:linear-gradient(180deg, rgba(120,185,245,.16) 0%, rgba(60,130,225,.1) 45%, rgba(40,110,215,.08) 100%);
  }
  .login-hero-shade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,60,140,0) 42%, rgba(10,45,120,.32) 74%, rgba(8,35,105,.5) 100%);
  }
  .login-hero-inner{
    /* absolute+inset:0 instead of height:100% — .login-hero's height now
       comes from flex-grow (not a fixed px value), and percentage heights
       don't reliably resolve against a flex-grown ancestor in Safari/WebKit.
       That's what let "Welcome Back!" collapse to the top instead of
       staying pinned to the bottom via .login-hero-copy's margin-top:auto.
       absolute/inset:0 always matches the parent's real rendered height,
       same as -photo/-tint/-shade above, regardless of how that height
       was computed. */
    position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
    /* var(--tg-content-safe-top) is Telegram's OWN inset for its fullscreen
       close/minimize control, separate from and additional to the OS's
       env(safe-area-inset-top) — see the requestFullscreen()/
       syncTelegramInsets() block near the bottom of this file. Defaults to
       0px outside Telegram (or on older clients that don't report it), so
       this is a no-op there — the plain env() value still applies alone. */
    padding:calc(16px + env(safe-area-inset-top) + var(--tg-content-safe-top,0px)) 22px 0;
  }
  /* Logo and top controls share one row so the logo is always forced to
     leave room for the controls (flex layout), instead of the controls
     floating on top via position:absolute with no awareness of how wide
     the logo happened to render at a given screen size — that mismatch
     was the actual cause of the controls covering the org name at
     narrower widths. */
  .login-top-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; row-gap:8px;
  }
  .login-brand{ flex:1 1 140px; min-width:110px; }
  .login-brand img{
    display:block; width:auto; height:auto; max-width:100%; max-height:38px;
    object-fit:contain; object-position:left top;
    filter:drop-shadow(0 1px 4px rgba(0,0,0,.25));
  }
  .login-hero-copy{ margin-top:auto; padding-bottom:24px; }
  .login-hero-copy h1{
    font-size:32px; line-height:1.6; font-weight:700; color:#fff; margin:0 0 8px;
    text-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .login-hero-copy p{
    font-size:13px; line-height:1.7; color:rgba(255,255,255,.92); margin:0;
    text-shadow:0 1px 6px rgba(0,0,0,.25);
  }

  /* ---------- Top-right: theme pill (exact port) + lang pill beside it ----------
     The design master only has the theme pill (no language switch exists in
     it at all — this app needs one, so it's added using the same glass-pill
     visual language, placed to its left rather than invented as a foreign
     element). Sits in the flex row above — never absolutely positioned —
     and never shrinks, so it keeps a legible, tappable size at any width;
     the logo is what gives way instead. */
  .login-top-controls{
    flex:0 0 auto; z-index:5; display:flex; align-items:center; gap:8px;
  }
  @media (max-width:360px){
    /* Very narrow phones: trim the controls' own footprint a bit further
       so the logo still gets a reasonable share of the row. */
    .login-top-controls{ gap:5px; }
    .login-lang-pill button{ padding:5px 6px; font-size:9.5px; }
    .login-theme-switch{ width:52px; height:28px; }
    .login-theme-switch .thumb{ width:22px; height:22px; }
    .login-screen.dark .login-theme-switch .thumb{ transform:translateX(24px); }
  }
  .login-lang-pill{
    display:flex; align-items:center; background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:3px;
    box-shadow:0 4px 14px rgba(10,20,50,.18); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .login-screen.dark .login-lang-pill{
    background:rgba(10,15,30,.32); border-color:rgba(255,255,255,.12);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .login-lang-pill button{
    border:none; background:transparent; padding:4px 6px; border-radius:999px; font-size:9px;
    font-weight:700; color:#fff; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .login-screen.dark .login-lang-pill button{ color:#dbe2f3; }
  .login-lang-pill button.active{ background:rgba(255,255,255,.92); color:var(--lp-ink); box-shadow:0 1px 3px rgba(10,20,50,.2); text-shadow:none; }
  .login-screen.dark .login-lang-pill button.active{ background:rgba(32,48,79,.92); color:#eef2fb; }

  /* Theme switch — ported field-for-field from ppwsa-login__Now.html: a
     60x32 pill, two faint static sun/moon glyphs in the track, and a 26px
     circular thumb that slides + crossfades its own sun/moon icon. Track
     is transparent glass; only the thumb itself stays solid (it's the
     indicator, not the housing). */
  .login-theme-switch{
    position:relative; width:54px; height:28px; padding:0; border:1px solid rgba(255,255,255,.35);
    border-radius:999px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    background:rgba(255,255,255,.18);
    box-shadow:0 4px 14px rgba(10,20,50,.18);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:background .4s ease, box-shadow .4s ease; flex-shrink:0;
  }
  .login-screen.dark .login-theme-switch{
    background:rgba(10,15,30,.32); border-color:rgba(255,255,255,.12);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .login-theme-switch .track-icon{
    position:absolute; top:50%; transform:translateY(-50%); width:16px; height:16px;
    display:flex; align-items:center; justify-content:center; color:#aab2c5; transition:color .4s ease, opacity .4s ease;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
  }
  .login-theme-switch .track-icon.sun{ left:8px; opacity:0; color:#fff; }
  .login-theme-switch .track-icon.moon{ right:8px; color:#fff; opacity:.85; }
  .login-screen.dark .login-theme-switch .track-icon.sun{ opacity:.85; color:#fff; }
  .login-screen.dark .login-theme-switch .track-icon.moon{ opacity:0; }
  .login-theme-switch .thumb{
    position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 32% 28%, #ffd27a 0%, #ffb648 45%, #f78d1e 100%);
    box-shadow:0 2px 6px rgba(230,140,20,.55), inset 0 1px 1px rgba(255,255,255,.6);
    transform:translateX(0); transition:transform .4s cubic-bezier(.4,0,.2,1), background .4s ease, box-shadow .4s ease;
  }
  .login-screen.dark .login-theme-switch .thumb{
    transform:translateX(26px);
    background:radial-gradient(circle at 32% 28%, #4a5a82 0%, #2a3654 45%, #161e33 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.12);
  }
  .login-theme-switch .thumb svg{ width:14px; height:14px; position:absolute; transition:opacity .25s ease, transform .35s ease; }
  .login-theme-switch .thumb .icon-sun{ color:#fff; opacity:1; transform:rotate(0deg) scale(1); }
  .login-theme-switch .thumb .icon-moon{ color:#dbe3ff; opacity:0; transform:rotate(-60deg) scale(.5); }
  .login-screen.dark .login-theme-switch .thumb .icon-sun{ opacity:0; transform:rotate(60deg) scale(.5); }
  .login-screen.dark .login-theme-switch .thumb .icon-moon{ opacity:1; transform:rotate(0deg) scale(1); }

  /* ---------- Card ---------- */
  .login-card{
    /* flex:0 0 auto (not flex:1) — the card should size to its own content,
       not stretch to fill leftover viewport height. .login-hero above is
       the one flex item meant to absorb leftover space (see its comment).
       With both set to flex:1, tall viewports (like the installed iPhone
       home-screen app, which has no browser chrome eating into the height)
       split the leftover space between hero AND card, leaving a blank gap
       under the "Sign up with Telegram" button instead of the hero photo
       filling that space. Letting only the hero grow removes that gap and
       matches the reference sizing. */
    position:relative; z-index:2; margin-top:-22px; background:var(--lp-card-bg);
    border-radius:26px 26px 0 0;
    /* Same reasoning as .login-hero-inner above: add Telegram's own bottom
       fullscreen inset (if any) on top of the OS safe area, defaulting to
       0px so nothing changes outside Telegram. */
    padding:24px 20px calc(20px + env(safe-area-inset-bottom) + var(--tg-content-safe-bottom,0px));
    flex:0 0 auto; display:flex; flex-direction:column; transition:background-color .35s ease;
  }
  .login-card h2{ text-align:center; font-size:22px; line-height:1.6; font-weight:700; margin:0 0 18px; color:var(--lp-ink); transition:color .35s ease; }
  .login-field{ position:relative; margin-bottom:12px; }
  .login-field input{
    width:100%; height:50px; padding:0 42px; border:1.5px solid var(--lp-line); border-radius:14px;
    font-size:14px; font-family:inherit; color:var(--lp-ink); background:var(--lp-field-bg); outline:none;
    transition:border-color .15s, background-color .35s ease, color .35s ease; box-sizing:border-box;
  }
  .login-field input::placeholder{ color:var(--lp-muted); }
  .login-field input:focus{ border-color:var(--lp-blue); }
  .login-field .ic{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--lp-field-ic); pointer-events:none; display:flex; transition:color .35s ease; }
  .login-field .ic svg{ width:17px; height:17px; }
  .login-field .eye{ position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; padding:5px; cursor:pointer; color:var(--lp-field-ic); display:flex; transition:color .35s ease; }
  .login-field .eye svg{ width:17px; height:17px; }

  .login-row-between{ display:flex; align-items:center; justify-content:space-between; margin:2px 0 16px; font-size:13px; }
  .login-remember{ display:flex; align-items:center; gap:8px; color:var(--lp-remember); cursor:pointer; user-select:none; transition:color .35s ease; }
  .login-remember input{ display:none; }
  .login-remember .box{
    width:18px; height:18px; border-radius:5px; border:1.5px solid var(--lp-line); background:var(--lp-field-bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .2s, border-color .2s;
  }
  .login-remember .box svg{ opacity:0; transition:opacity .15s; width:12px; height:12px; }
  .login-remember input:checked + .box{ background:var(--lp-blue); border-color:var(--lp-blue); }
  .login-remember input:checked + .box svg{ opacity:1; }
  .login-row-between a{ color:var(--lp-blue); text-decoration:none; font-weight:600; }

  .login-btn{
    width:100%; height:52px; border:none; border-radius:16px; font-family:inherit; font-size:15px; font-weight:700;
    color:#fff; cursor:pointer; background:linear-gradient(180deg, var(--lp-blue) 0%, var(--lp-blue-dark) 100%);
    box-shadow:0 10px 22px -6px rgba(14,114,246,.55);
  }
  .login-btn:active{ transform:translateY(1px); }

    const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 14000);
    window[cbName] = (data)=>{ clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = ()=>{ clearTimeout(timer); cleanup(); reject(new Error("script_load_failed")); };
    script.src = `${url}&callback=${cbName}`;
    document.body.appendChild(script);
  });
}
async function fetchCall(url){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 10000);
  try{
    const res = await fetch(url, { method:"GET", redirect:"follow", signal: controller.signal });
    if(!res.ok) throw new Error("http_" + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}
async function sequentialTransport_(url){
  try{
    return await fetchCall(url);
  }catch(fetchErr){
    try{
      return await jsonpCall(url);
    }catch(jsonpErr){
      throw new Error(`transport_failed — fetch: ${fetchErr.message}; jsonp: ${jsonpErr.message}`);
    }
  }
}

async function apiCall(action, payload){
  const q = encodeURIComponent(JSON.stringify({ action, initData:"", browserSession:getBrowserSession(), payload:payload||{} }));
  const data = await sequentialTransport_(`${API_URL}?data=${q}`);
  if(!data.ok){
    if(data.error === "must_change_pin"){ setMustPin_(true); showForcedPin(); }
    const err = new Error(data.detail ? `${data.error}: ${data.detail}` : (data.error || "api_error"));
    err.code = data.error; err.payload = data; throw err;
  }
  if(action==="browserLogin" || action==="browserLoginVerifyOtp"){ saveMe_(data.me, payload && payload.name); }
  return data;
}

function buildApps(){
list.innerHTML = '';
APPS.forEach(a0 => {
  const a = Object.assign({}, a0, { url: (a0.adminUrl && isAdminRole()) ? a0.adminUrl : a0.url });
  const li = document.createElement('li');

  li.innerHTML =
    `<a class="app" href="${ready ? a.url : '#'}" ${ready ? '' : 'aria-disabled="true" tabindex="-1"'}>
       <img class="ico" src="${a.icon}" alt="" width="60" height="60">

     </a>`;
  if(ready && a.sso){
    li.querySelector('a.app').addEventListener('click', e=>{
      const s = getBrowserSession(); if(!s) return;
      e.preventDefault();
      location.href = a.url + (a.url.indexOf('#') > -1 ? '&' : '#') + 'psmd_session=' + encodeURIComponent(s);
    });
  }
  li.querySelector('.name').textContent = a.name;
  li.querySelector('.desc').textContent = a.desc;
  list.appendChild(li);
});

/* Perspective tilt + glare on hover (pointer devices only, skipped for reduced motion) */
if (matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches) {
  list.querySelectorAll('li').forEach(li => {
    const card = li.querySelector('a.app');
    li.addEventListener('pointermove', e => {
      const r = li.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      li.style.setProperty('--ry', ((x - .5) * 10).toFixed(2) + 'deg');
      li.style.setProperty('--rx', ((.5 - y) * 10).toFixed(2) + 'deg');
      card.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      card.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    });
    li.addEventListener('pointerleave', () => { li.style.removeProperty('--rx'); li.style.removeProperty('--ry'); });
  });
}
}

/* ប៊ូតុងដំឡើង (Android/Chrome) និងសម្គាល់ iPhone */
let deferred;
const btn = document.getElementById('installBtn');
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  if (!standalone) btn.style.display = 'block';
});
btn.addEventListener('click', async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice;
  deferred = null; btn.style.display = 'none';
});
if (/iphone|ipad/i.test(navigator.userAgent) && !standalone) {
  document.getElementById('iosHint').style.display = 'block';
}

function initApi(){ if(!getBrowserSession()) return showLogin(); if(mustPin_()) return showForcedPin(); showHub(); }   // ហៅដោយ Login ពេលជោគជ័យ
async function verifySession(){                                        // ពិនិត្យ Session ម្តងក្នុង ៦ ម៉ោង
  let last = 0; try{ last = +localStorage.getItem(CHECK_KEY) || 0; }catch(e){}
  if(Date.now() - last < 6*3600*1000) return;
  try{
    let res;
    try{ res = await apiCall("whoAmI"); }
    catch(e){ if(e.code === "unknown_action") res = await apiCall("getInitialData"); else throw e; }
    saveMe_(res.me);
    if(res.mustChangePin){ setMustPin_(true); showForcedPin(); return; }
    setMustPin_(false);
    showHub();
    try{ localStorage.setItem(CHECK_KEY, String(Date.now())); }catch(e){}
  }catch(e){
    if(e.payload){ setBrowserSession(""); showLogin(); }               // Server បដិសេធ → ចូលម្តងទៀត; ខ្វះអ៊ីនធឺណិត → នៅដដែល
  }
}
document.getElementById("logoutBtn").addEventListener("click", ()=>{ setBrowserSession(""); showLogin(); });
applyTheme();
if(getBrowserSession()){ showHub(); verifySession(); } else { showLogin(); }

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
