<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRD-Calendar Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1A22" media="(prefers-color-scheme: dark)">
<script>try{var m=localStorage.getItem("psmd_theme")||"auto";document.documentElement.dataset.theme=(m==="auto"?matchMedia("(prefers-color-scheme: dark)").matches:m==="dark")?"dark":"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --surface2:#F6F9FB; --ink:#0C2B38; --muted:#52707E; --line:#D5E1E7;
  --brand:#0A5C7A; --brand-ink:#FFFFFF; --focus:#F4B400; --shadow:0 1px 2px rgba(6,55,74,.06),0 6px 18px -8px rgba(6,55,74,.18);
  --st-p:#2458D6; --st-p-bg:#E6EEFF;
  --st-i:#9A5B00; --st-i-bg:#FFF0D2;
  --st-c:#14753F; --st-c-bg:#DFF4E7;
  --st-o:#C42B26; --st-o-bg:#FDE4E3;
  --st-x:#5B6772; --st-x-bg:#E8ECEF;
  --side-w:264px;
  box-sizing:border-box;
}
:root[data-theme="dark"]{
  --bg:#0A1A22; --surface:#10303D; --surface2:#0D2832; --ink:#E6F1F5; --muted:#9DB8C4; --line:#1D4556;
  --brand:#2B93B8; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
  --st-p:#8CB0FF; --st-p-bg:rgba(60,110,230,.22);
  --st-i:#F4C25A; --st-i-bg:rgba(230,160,20,.20);
  --st-c:#6FDB9C; --st-c-bg:rgba(40,170,100,.22);
  --st-o:#FF8D87; --st-o-bg:rgba(220,60,55,.24);
  --st-x:#B4BFC8; --st-x-bg:rgba(150,165,178,.18);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Kantumruy Pro","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:var(--side-w);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#3FC0D6,#0A5C7A);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font-size:.98rem;line-height:1.6}
.brand small{color:var(--muted);font-size:.78rem}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;min-height:44px}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.nav .navgrp{font-size:.74rem;font-weight:600;letter-spacing:0;color:var(--muted);padding:6px 12px 4px}
.nav .navgrp:not(:first-child){margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.nav .ic{width:20px;height:20px;flex:none}
.nav .lbl{flex:1;min-width:0}
.nav .lbl small{display:block;color:var(--muted);font-size:.74rem;line-height:1.6}
.nav button[aria-current="page"] .lbl small{color:rgba(255,255,255,.8)}
.nav .soon{font-size:.68rem;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:.78rem;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px}
.me{font-size:.85rem;color:var(--muted);max-width:30ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none}
.scrim{display:none}
#view{padding:18px 20px 40px;flex:1}
@media (max-width:999px){
  .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .burger{display:inline-grid}
  .me{display:none}
  .top{padding:10px 12px}
  #view{padding:12px 12px 32px}
}

/* ---------- toolbar / filters ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1}
.btn{min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;min-height:40px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.range-title{font-size:1.1rem;font-weight:700;min-width:11ch;text-align:center}
.field{display:grid;gap:2px;font-size:.76rem;color:var(--muted)}
.field select,.field input{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.s-p{--c:var(--st-p);--b:var(--st-p-bg)} .s-i{--c:var(--st-i);--b:var(--st-i-bg)} .s-c{--c:var(--st-c);--b:var(--st-c-bg)}
.s-o{--c:var(--st-o);--b:var(--st-o-bg)} .s-x{--c:var(--st-x);--b:var(--st-x-bg)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;background:var(--b);color:var(--c);font-weight:600;font-size:.8rem;white-space:nowrap}
.note{padding:10px 14px;border-radius:12px;background:var(--st-i-bg);color:var(--st-i);margin-bottom:10px;font-size:.88rem}

/* ---------- calendar ---------- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 6px;text-align:center;font-weight:700;font-size:.8rem;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--surface2)}
.cell.out .dn{opacity:.55}
.dn{align-self:flex-start;min-width:26px;height:26px;border-radius:13px;display:inline-grid;place-items:center;font-weight:700;font-size:.82rem;border:0;background:none;padding:0 6px}
.dn:hover{background:var(--surface2)}
.cell.today .dn{background:var(--brand);color:var(--brand-ink)}
.ev{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:var(--b);color:var(--ink);border-radius:6px;padding:2px 6px;font-size:.76rem;line-height:1.6;min-width:0;min-height:24px}
.ev:hover{filter:brightness(.97)}
.ev .tm{color:var(--c);font-weight:700;flex:none}
.ev .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .pg{flex:none;color:var(--c);font-weight:700}
.more{border:0;background:none;color:var(--brand);font-weight:700;font-size:.76rem;text-align:left;padding:2px 6px;min-height:24px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding:0 4px}
@media (max-width:699px){
  .cell{min-height:64px;padding:2px;cursor:pointer}
  .cell .ev,.cell .more{display:none}
  .dots{display:flex}
  .dow div{padding:6px 0;font-size:.68rem}
}
.cols{display:grid;gap:0;grid-template-columns:repeat(7,minmax(0,1fr))}
.col{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:6px;padding:6px;min-height:260px}
.col:last-child{border-right:0}
.col h3{margin:0;font-size:.85rem;display:flex;align-items:center;gap:6px}
.col.today h3 span{background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 8px}
.card{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:var(--b);color:var(--ink);border-radius:8px;padding:6px 8px;min-width:0}
.card:hover{filter:brightness(.97)}
.card .t1{font-weight:700;font-size:.84rem;overflow-wrap:anywhere}
.card .t2{font-size:.76rem;color:var(--muted)}
.card .t3{font-size:.76rem;color:var(--c);font-weight:700}
.daylist{display:grid;gap:8px;padding:12px}
.dayrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.dayrow .tm{font-weight:700;color:var(--muted);padding-top:8px;font-size:.88rem}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--st-c)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:899px){
  .cols{grid-template-columns:1fr}
  .col{border-right:0;border-bottom:1px solid var(--line);min-height:0}
  .dayrow{grid-template-columns:70px 1fr}
}

/* ---------- detail panel ---------- */
.panel{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px -12px rgba(0,0,0,.35);z-index:40;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease}
.panel.open{transform:none}
.panel header{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel header h2{margin:0;font-size:1.05rem;flex:1;overflow-wrap:anywhere}
.panel .body{overflow-y:auto;padding:14px 16px 28px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:0 0 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{position:sticky;top:0;text-align:left;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);background:var(--surface)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
a{color:var(--brand)}
:root[data-theme="dark"] a{color:#7CCBE6}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-top:4px solid var(--c,var(--brand))}
.kpi .n{font-size:1.7rem;font-weight:700;line-height:1.15}
.kpi .l{color:var(--muted);font-size:.82rem}
.kpi .d{font-size:.78rem;font-weight:600}
.d.up{color:var(--st-c)} .d.down{color:var(--st-o)} .d.flat{color:var(--muted)}
button.kc{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}button.kc:hover,.panelbox[data-kpi]:hover{border-color:var(--c,var(--brand))}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:6px}.kc .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;background:var(--b);color:var(--c)}.kc .n{font-size:1.9rem;font-weight:700;line-height:1.05}.kc .l{color:var(--muted);font-size:.85rem}
.bar3{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar3 i{display:block;height:100%;border-radius:4px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px}.sc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}.sc>summary::-webkit-details-marker{display:none}
.av3{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}.sc .nm{min-width:0;flex:1}.sc .nm b{font-size:1.02rem}.sc .nm small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:0}.sc .rl{color:var(--st-p);font-weight:600;font-size:.85rem}.sc .m{color:var(--muted);font-size:.85rem}
.sc .pc3{text-align:right;font-weight:700;font-size:1.15rem;flex:none}.sc .chev{color:var(--muted);transition:transform .15s;flex:none}.sc[open] .chev{transform:rotate(180deg)}
.sc-body{padding:0 14px 14px;display:grid;gap:8px}.oc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}.oc .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.oc .m{color:var(--muted);font-size:.85rem}
.panelbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px;overflow-x:auto}
.panelbox h3{margin:0 0 8px;font-size:1rem}
.rate{display:flex;align-items:center;gap:8px;min-width:150px}
.rate .trk{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.rate .trk i{display:block;height:100%;background:var(--st-c)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.ph{max-width:60ch;margin:40px auto;text-align:center;color:var(--muted)}
.ph h2{color:var(--ink)}
.gate{max-width:520px;margin:12vh auto;padding:24px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.side,.panel{transition:none}}
.field textarea{min-height:70px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.shm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:200}.shc{background:var(--surface);color:var(--ink);padding:18px;border-radius:14px;width:min(440px,92vw);display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.shc h3{margin:0;font-size:1rem;word-break:break-all}.shc .btn{text-align:center;text-decoration:none;display:block}.shc .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asg{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:10px}.asg legend{font-weight:600;padding:0 6px}.seg{display:flex;gap:14px;flex-wrap:wrap}.seg label{display:flex;gap:6px;align-items:center;cursor:pointer}
.slist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px}.slist label{display:flex;gap:8px;padding:6px 10px;align-items:center;cursor:pointer}.slist label:hover{background:var(--surface2)}
/* ---------- Phase 4: settings / audit ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px 14px;min-height:44px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#7CCBE6;border-bottom-color:#7CCBE6}
.pill{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--st-c-bg);color:var(--st-c);border-color:transparent}
.pill.warn{background:var(--st-i-bg);color:var(--st-i);border-color:transparent}
.pill.bad{background:var(--st-o-bg);color:var(--st-o);border-color:transparent}
.pill.adm{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.sm{min-height:32px;padding:2px 10px;font-size:.8rem;border-radius:8px}
.btn.danger{border-color:var(--st-o);color:var(--st-o)}
.btn.danger.fill{background:var(--st-o);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:4px}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.dlg{background:var(--surface);color:var(--ink);padding:18px;border-radius:14px;width:min(520px,94vw);max-height:92vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h3{margin:0;font-size:1.05rem}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg .opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.dlg .opt input{margin-top:5px}
.dlg .pw{display:flex;gap:6px}.dlg .pw input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace}
.dlg input[type=text],.dlg input[type=password],.dlg select{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.dlg .err{color:var(--st-o);font-weight:600;min-height:1.2em}
.secret{font:700 1.3rem ui-monospace,Consolas,monospace;letter-spacing:.06em;padding:10px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line);text-align:center;overflow-wrap:anywhere;user-select:all}
.yn{font-weight:700}.yn.y{color:var(--st-c)}.yn.n{color:var(--muted);font-weight:400}
.lang-opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:6px}

.myf{display:grid;gap:10px;padding:14px}.myf .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Phase 5: notifications ---------- */
.bellwrap{position:relative;flex:none}
.bellcnt{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--st-o);color:#fff;font-size:.7rem;font-weight:700;line-height:15px;text-align:center;border:2px solid var(--surface);pointer-events:none}
.nav .cnt{flex:none;min-width:20px;padding:0 7px;border-radius:999px;background:var(--st-o);color:#fff;font-size:.7rem;font-weight:700;text-align:center;line-height:1.5}
.nav button[aria-current="page"] .cnt{background:#fff;color:var(--st-o)}
.npop{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 24px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 18px 40px -16px rgba(0,0,0,.35);z-index:50;overflow:hidden}
@media (max-width:699px){.bellwrap{position:static}.npop{position:fixed;left:12px;right:12px;top:58px;width:auto}}
.nphead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.nphead b{flex:1}
.nplist{overflow-y:auto}
.npfoot{padding:8px 12px;border-top:1px solid var(--line);text-align:center}

<script>
"use strict";
/* ===== Config — same backend + browser session as the Hub ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbzU9Shv_f8c5pAAa6woqYOoBV6kLmb9H0Id6wOWlnlr6T9YUgoo0gn43YdYyypDtq6A/exec";
const SESSION_KEY = "psmd_digital_session_v1", THEME_KEY = "psmd_theme";
// UX only — admin-api.gs decides who may see what, and how much. Same tiers as the staff app's Reports tab.
const portalRole = r => { r = String(r || "").trim(); return r === "Super Admin" || r === "Supervisor"; };   // UX only — the server decides (admin-api.gs)

/* ===== transport (same fetch → JSONP fallback as the Hub) ===== */
let _jp = 0;
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = "__adm_cb_" + (++_jp), s = document.createElement("script");
    const clean = () => { delete window[cb]; s.remove(); };
    const tm = setTimeout(() => { clean(); rej(new Error("timeout")); }, 30000);
    window[cb] = d => { clearTimeout(tm); clean(); res(d); };
    s.onerror = () => { clearTimeout(tm); clean(); rej(new Error("script_load_failed")); };
    s.src = url + "&callback=" + cb; document.body.appendChild(s);
  });
}
async function viaFetch(url){
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 30000);
  try { const r = await fetch(url, { method: "GET", redirect: "follow", signal: ac.signal }); if (!r.ok) throw new Error("http_" + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function transport(url){ try { return await viaFetch(url); } catch (e) { return await jsonp(url); } }
function getSession(){ try { return localStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; } }
async function api(action, payload){
  const q = encodeURIComponent(JSON.stringify({ action, initData: "", browserSession: getSession(), payload: payload || {} }));
  const d = await transport(API_URL + "?data=" + q);
  if (!d.ok) { const e = new Error(d.detail ? d.error + ": " + d.detail : (d.error || "api_error")); e.code = d.error; e.payload = d; throw e; }
  return d;
}

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
const pad = n => String(n).padStart(2, "0");
const toISO = d => d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
const fromISO = s => { const p = s.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); };
const addDays = (s, n) => toISO(new Date(fromISO(s).getTime() + n * 864e5));
const mondayOf = s => addDays(s, -((fromISO(s).getUTCDay() + 6) % 7));
const localISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const monthStart = s => s.slice(0, 8) + "01";
const monthEnd = s => { const d = fromISO(monthStart(s)); d.setUTCMonth(d.getUTCMonth() + 1, 0); return toISO(d); };
const addMonths = (s, n) => { const d = fromISO(monthStart(s)); d.setUTCMonth(d.getUTCMonth() + n, 1); return toISO(d); };
const MONTHS = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
const DOW = ["ច័ន្ទ", "អង្គារ", "ពុធ", "ព្រហស្បតិ៍", "សុក្រ", "សៅរ៍", "អាទិត្យ"];
const fmtDay = s => { const d = fromISO(s); return DOW[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
const PLANTS = { bkg: "BKG WTP", ppr: "PPR WTP", ccw: "CCW WTP", ccm: "CCM WTP", nr: "NR WTP", bth: "BTH WTP", tkm: "TKM WTP", mlc: "MLC WTP", tbk: "TBK WTP" };
const plantLabel = p => PLANTS[p] || (p ? p : "ការិយាល័យកណ្ដាល · Central office");
const OFFICES = { production: "PRDO", lab: "LABO", mech_elec: "MNEO" };
const REPEAT = { none: "មិនធ្វើម្តងទៀត · No repeat", daily: "រាល់ថ្ងៃ · Daily", workday: "រាល់ថ្ងៃធ្វើការ · Every workday", every2d: "រៀងរាល់ ២ ថ្ងៃ · Every 2 days", every3d: "រៀងរាល់ ៣ ថ្ងៃ · Every 3 days", every4d: "រៀងរាល់ ៤ ថ្ងៃ · Every 4 days", weekly: "រាល់សប្តាហ៍ · Weekly", every2w: "រៀងរាល់ ២ សប្តាហ៍ · Every 2 weeks", every3w: "រៀងរាល់ ៣ សប្តាហ៍ · Every 3 weeks", monthly: "រាល់ខែ · Monthly", quarterly: "រាល់ត្រីមាស · Quarterly", every6m: "រាល់ ៦ ខែ · Every 6 months" };
// Notify choices (minutes before start) — same list as the Telegram Mini App
const NOTIFY_OPTS = [[5, "5 នាទីមុន · 5 mins before"], [10, "10 នាទីមុន · 10 mins before"], [15, "15 នាទីមុន · 15 mins before"], [20, "20 នាទីមុន · 20 mins before"], [30, "30 នាទីមុន · 30 mins before"], [60, "1 ម៉ោងមុន · 1 hour before"], [120, "2 ម៉ោងមុន · 2 hours before"], [180, "3 ម៉ោងមុន · 3 hours before"], [240, "4 ម៉ោងមុន · 4 hours before"], [360, "6 ម៉ោងមុន · 6 hours before"], [1440, "1 ថ្ងៃមុន · 1 day before"], [2880, "2 ថ្ងៃមុន · 2 days before"]];
// Duration choices (minutes) — picks the End time automatically
const DURATION_OPTS = [[15, "15 នាទី · 15 mins"], [30, "30 នាទី · 30 mins"], [45, "45 នាទី · 45 mins"], [60, "1 ម៉ោង · 1 hour"], [90, "1.5 ម៉ោង · 1.5 hours"], [120, "2 ម៉ោង · 2 hours"], [180, "3 ម៉ោង · 3 hours"], [240, "4 ម៉ោង · 4 hours"], [360, "6 ម៉ោង · 6 hours"], [480, "8 ម៉ោង · 8 hours"], [720, "12 ម៉ោង · 12 hours"]];
const SCOPE = { direct: "បុគ្គលិកម្នាក់ / Individual", team: "ក្រុម / Team", plant: "ទាំងរោងចក្រ / Whole plant", office: "ការិយាល័យ / Office", dept: "ទាំងនាយកដ្ឋាន / Department" };
const ST = {
  p: { en: "Planned", kh: "ផែនការ", ic: "○" }, i: { en: "In Progress", kh: "កំពុងធ្វើ", ic: "◐" },
  c: { en: "Completed", kh: "បានបញ្ចប់", ic: "✓" }, o: { en: "Overdue", kh: "ហួសកំណត់", ic: "!" }, x: { en: "Cancelled", kh: "បានលុបចោល", ic: "✕" }
};
const badge = k => `<span class="badge s-${k}">${ST[k].ic} ${ST[k].kh} · ${ST[k].en}</span>`;
const staffName = s => s ? (s.kh || s.en || s.id) : "—";
const taskTitle = t => t.kh || t.en || "(គ្មានចំណងជើង)";
const norm = v => String(v || "").normalize("NFC").toLowerCase();

/* ===== state ===== */
const S = { me: null, view: "dashboard", mode: "month", anchor: localISO(), loadedMonth: "", data: null, f: { plant: "", team: "", staff: "", status: "", q: "" }, dash: null, tok: 0 };
let D = null, OCC = [];   // current calendar dataset

function prepare(raw){
  const occ = raw.occ.map(a => ({ ti: a[0], t: raw.tasks[a[0]], date: a[1], s: raw.staff[a[2]], st: a[3], at: a[4], link: a[5] }));
  occ.forEach(o => { o.h = null; });
  return { raw, staff: raw.staff, tasks: raw.tasks, occ };
}
const hay = o => o.h || (o.h = norm([o.t.kh, o.t.en, o.t.loc, o.t.desc, o.s && o.s.kh, o.s && o.s.en, o.s && o.s.id].join(" ")));
function passes(o, f){
  const q = norm(f.q).trim();
  return (!f.plant || (o.s && o.s.plant === (f.plant === "_" ? "" : f.plant))) && (!f.team || (o.s && o.s.team === (f.team === "_" ? "" : f.team)))
    && (!f.staff || (o.s && o.s.id === f.staff)) && (!f.status || o.st === f.status) && (!q || hay(o).includes(q));
}
function groupOcc(list){
  const m = new Map();
  list.forEach(o => {
    const k = o.ti + "|" + o.date; let g = m.get(k);
    if (!g) { g = { k, ti: o.ti, t: o.t, date: o.date, occs: [], c: { p: 0, i: 0, c: 0, o: 0, x: 0 } }; m.set(k, g); }
    g.occs.push(o); g.c[o.st]++;
  });
  const out = [...m.values()];
  out.forEach(g => { const n = g.occs.length, live = n - g.c.x; g.n = n; g.live = live;
    g.st = g.c.x === n ? "x" : g.c.c === live ? "c" : g.c.o > 0 ? "o" : (g.c.i > 0 || g.c.c > 0) ? "i" : "p"; });
  out.sort((a, b) => (a.t.start || "99:99").localeCompare(b.t.start || "99:99") || taskTitle(a.t).localeCompare(taskTitle(b.t)));
  return out;
}
function stats(list){
  const c = { p: 0, i: 0, c: 0, o: 0, x: 0 }; list.forEach(o => c[o.st]++);
  const total = c.p + c.i + c.c + c.o; return Object.assign(c, { total, rate: total ? c.c / total * 100 : 0 });
}

/* ===== gate / boot ===== */
function showGate(html){ $("#app").hidden = true; const g = $("#gate"); g.hidden = false; g.innerHTML = html; }
function hideGate(){ $("#gate").hidden = true; $("#app").hidden = false; }
function errText(e){

  const m = {
    auth_failed: "ការចូលប្រើផុតកំណត់ ឬមិនត្រឹមត្រូវ — សូមចូលប្រើម្តងទៀតតាម Hub។ / Session expired — please sign in again via the Hub.",
    permission_denied: "គណនីនេះមិនមានសិទ្ធិ Admin ទេ។ / This account does not have Admin access.",

    bad_range: "ជួរកាលបរិច្ឆេទមិនត្រឹមត្រូវ (អតិបរមា ៧០ ថ្ងៃ)។ / Invalid date range (max 70 days).",
    has_completions: "ការងារនេះមានអ្នកបញ្ចប់រួចហើយ មិនអាចលុបបានទេ — សូមប្រើ «បោះបង់» វិញ។ / Someone already completed this task, so it cannot be deleted — use Cancel instead.",
    task_not_found: "រកមិនឃើញការងារនេះ (អាចត្រូវបានលុបរួច)។ / Task not found (it may already be deleted).",
    missing_title: "សូមបញ្ចូលចំណងជើង។ / Title is required.", bad_task_time: "កាលបរិច្ឆេទ ឬម៉ោងមិនត្រឹមត្រូវ។ / Invalid date or time.", bad_link: "Link ត្រូវចាប់ផ្តើមដោយ https:// / Link must start with https://",
    server_busy_please_retry: "ម៉ាស៊ីនបម្រើកំពុងរវល់ សូមព្យាយាមម្តងទៀត។ / Server busy — please retry.",

  };
  return m[e.code] || ("មិនអាចទាញទិន្នន័យបាន / Could not load data: " + (e.message || e));
}
async function boot(){
  showGate('<span class="spin"></span>កំពុងផ្ទុក… / Loading…');
  const m = location.hash.match(/psmd_session=([^&]+)/);
  if (m) { try { localStorage.setItem(SESSION_KEY, decodeURIComponent(m[1])); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  if (!getSession()) return showGate('<h2>សូមចូលប្រើជាមុន</h2><p>Please sign in through the Hub first.</p><p><a class="btn primary" href="./" style="display:inline-block;text-decoration:none;line-height:28px">ទៅ Hub / Open Hub</a></p>');

    return showGate(`<h2>⚠️</h2><p>${esc(errText(e))}</p><p><button class="btn primary" id="retry">ព្យាយាមម្តងទៀត / Retry</button> <a class="btn" href="./" style="display:inline-block;text-decoration:none;line-height:28px">Hub</a></p>`), $("#retry").addEventListener("click", boot);

  catch (e) {

  hideGate();
  $("#me").textContent = (S.me.khmer_name || S.me["khmer _name"] || S.me.name || "") + " · " + S.me.role;

}

function ntLoad(force){

  let list;
  if (!NT.loaded) list = NT.err ? `<div class="empty">${esc(ntErr(NT.err))}</div>` : `<div class="empty"><span class="spin"></span>${esc(L("កំពុងទាញទិន្នន័យ…", "Loading…"))}</div>`;
  else if (!NT.items.length) list = `<div class="empty">${esc(L("មិនមានការជូនដំណឹងទេ។", "No notifications."))}</div>`;
  else list = NT.items.slice(0, 8).map(i => ntItemHTML(i, true)).join("");
  p.innerHTML = `<div class="nphead"><b>${esc(L("ការជូនដំណឹង", "Notifications"))}${NT.unread ? ` <span class="pill bad">${NT.unread}</span>` : ""}</b><button class="btn sm" data-nall${NT.unread ? "" : " disabled"}>${esc(L("អានទាំងអស់", "Mark all read"))}</button></div>
    <div class="nplist">${list}</div><div class="npfoot"><button class="btn sm" data-nviewall>${esc(L("មើលទាំងអស់", "View all"))}</button></div>`;
}
/* full page (sidebar → Notifications) */
function renderNotify(){
  if (NT.loaded) paintNotify(); else { $("#view").innerHTML = `<div class="note"><span class="spin"></span>${esc(L("កំពុងទាញទិន្នន័យ…", "Loading…"))}</div>`; }
  NT.sig = ""; ntLoad(true);
}
function paintNotify(){
  const view = $("#view"); if (S.view !== "notify") return;
  if (!NT.loaded) {
    if (NT.err) view.innerHTML = `<div class="gate" style="margin:30px auto"><p>${esc(ntErr(NT.err))}</p><p><button class="btn primary" id="ntRetry">${esc(L("ព្យាយាមម្តងទៀត", "Retry"))}</button></p></div>`;
    return;
  }
  const f = NT.flt, ty = NT.type;
  const list = NT.items.filter(i => (f === "all" || !i.read) && (!ty || i.type === ty));
  let body = "";
  if (!list.length) body = `<div class="empty">${esc(f === "unread" ? L("គ្មានការជូនដំណឹងដែលមិនទាន់អានទេ។ 🎉", "No unread notifications. 🎉") : L("មិនមានការជូនដំណឹងទេ។", "No notifications."))}</div>`;
  else {
    let last = "";
    body = list.map(i => { const k = ntDayKey(i.ts); const h = k !== last ? `<div class="ngrp">${esc(ntDayLabel(k))}</div>` : ""; last = k; return h + ntItemHTML(i, false); }).join("");
    body = `<div class="nlist">${body}</div>`;
  }
  view.innerHTML = `${NT.err ? `<div class="note">${esc(ntErr(NT.err))}</div>` : ""}
    <div class="tabs" role="group" aria-label="${esc(L("ត្រង", "Filter"))}">${[["all", "ទាំងអស់", "All", NT.items.length], ["unread", "មិនទាន់អាន", "Unread", NT.unread]].map(t => `<button data-nflt="${t[0]}" aria-selected="${f === t[0]}">${esc(L(t[1], t[2]))} (${t[3]})</button>`).join("")}</div>
    <div class="bar"><label class="field">${esc(L("ប្រភេទ", "Type"))}<select id="ntType">${opt("", L("ទាំងអស់", "All"), ty)}${Object.keys(NT_TYPES).map(k => opt(k, L(NT_TYPES[k][0], NT_TYPES[k][1]), ty)).join("")}</select></label>
      <span class="grow"></span><button class="btn primary" id="ntAllBtn"${NT.unread ? "" : " disabled"}>${esc(L("សម្គាល់ថាបានអានទាំងអស់", "Mark all as read"))}</button></div>
    ${body}
    <p class="note" style="background:var(--surface2);color:var(--muted);margin-top:12px">${esc(L("បង្ហាញការងារថ្មី ការងារជិតដល់ម៉ោង ហួសកំណត់ បានបញ្ចប់ និងព្រឹត្តិការណ៍ប្រព័ន្ធក្នុង ១៤ ថ្ងៃចុងក្រោយ។ ស្ថានភាពបានអានរក្សាទុកក្នុង Sheet «Notification_Reads» ហើយនៅដដែលលើគ្រប់ឧបករណ៍។", "Shows new, upcoming, overdue and completed tasks and system events from the last 14 days. Read status is saved in the “Notification_Reads” sheet and follows you across devices."))}</p>`;
}
/* events */
document.addEventListener("click", e => {
  const t = e.target.closest("#bell,[data-nopen],[data-nread],[data-nall],[data-nviewall],[data-nflt],#ntRetry,#ntAllBtn");
  if (!t) { if (NT.open && !e.target.closest(".bellwrap")) ntClosePop(); return; }
  if (t.id === "bell") return ntTogglePop();
  if (t.dataset.nopen) return ntGo(t.dataset.nopen);
  if (t.dataset.nread) return ntMark([t.dataset.nread]);
  if (t.dataset.nall !== undefined || t.id === "ntAllBtn") return ntMark([], true);
  if (t.dataset.nviewall !== undefined) { ntClosePop(); if (S.view === "notify") route(); else location.hash = "#/notify"; return; }
  if (t.dataset.nflt) { NT.flt = t.dataset.nflt; return paintNotify(); }
  if (t.id === "ntRetry") { NT.sig = ""; ntLoad(true); renderNotify(); }
});
document.addEventListener("change", e => { if (e.target.id === "ntType") { NT.type = e.target.value; paintNotify(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && NT.open) { ntClosePop(); const b = $("#bell"); if (b) b.focus(); } });

boot();
</script>
</body>
</html>
