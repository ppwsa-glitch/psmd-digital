/* ===== PSMD Sidebar Workspace ===== */
.workspace{max-width:1680px;margin:0 auto;min-height:100vh;padding:18px;display:grid;grid-template-columns:264px minmax(0,1fr);gap:18px}
.sidebar{position:sticky;top:18px;height:calc(100vh - 36px);min-height:620px;padding:18px 14px;display:flex;flex-direction:column;overflow:auto;z-index:30}
.side-brand{display:flex;align-items:center;gap:11px;padding:5px 8px 20px;border-bottom:1px solid var(--line)}
.side-brand .logo{width:43px;height:43px;flex:none}
.side-brand strong{display:block;font-size:14px;letter-spacing:-.3px}
.side-brand small{display:block;color:var(--muted);font-size:10px}
.side-label{padding:18px 10px 7px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px}
.side-nav{display:grid;gap:5px}
.side-link{width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;color:var(--muted);font-size:12px;font-weight:600;transition:.18s}
.side-link .side-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--glass2);font-size:15px;flex:none}
.side-link:hover{background:var(--glass2);color:var(--ink)}
.side-link.active{background:linear-gradient(120deg,rgba(142,112,232,.18),rgba(107,74,203,.09));border-color:rgba(142,112,232,.22);color:var(--purple);font-weight:800}
.side-link.active .side-ico{background:linear-gradient(135deg,#9274ee,#6c4bcf);color:#fff}
.side-count{margin-left:auto;padding:2px 7px;border-radius:7px;background:var(--lav);font-size:10px}
.side-spacer{flex:1;min-height:18px}
.side-bottom{border-top:1px solid var(--line);padding:13px 5px 0}
.side-user{display:flex;align-items:center;gap:9px;padding:8px}
.side-user .avatar{flex:none}
.side-user b{display:block;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user small{display:block;color:var(--muted);font-size:10px}
.main-area{min-width:0}
.main-area .app-inner{max-width:1500px;margin:auto;padding:8px 8px 35px}
.mobile-side-toggle{display:none}
.side-overlay{display:none}
@media(max-width:900px){
 .workspace{display:block;padding:12px}
 .sidebar{position:fixed;top:10px;bottom:10px;left:10px;width:min(285px,calc(100vw - 55px));height:auto;min-height:0;transform:translateX(calc(-100% - 20px));transition:transform .25s ease;box-shadow:0 24px 70px rgba(28,20,65,.25)}
 .workspace.side-open .sidebar{transform:translateX(0)}
 .side-overlay{display:block;position:fixed;inset:0;background:#17132c66;z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .workspace.side-open .side-overlay{opacity:1;pointer-events:auto}
 .main-area .app-inner{padding:5px 2px 30px}
 .mobile-side-toggle{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);background:var(--glass2);border-radius:14px;font-size:19px}
 .topbar{justify-content:flex-start}
 .top-actions{margin-left:auto}
}
@media(max-width:600px){.workspace{padding:9px}.topbar{gap:8px}.brand{gap:8px}.brand h1{font-size:14px}.brand p{font-size:9px}.main-area .app-inner{padding-top:2px}}
